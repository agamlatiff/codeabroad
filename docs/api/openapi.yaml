openapi: 3.0.3
info:
  title: Merantalk API Documentation
  description: >
    Official RESTful API documentation for Merantalk — Global Language Mastery Platform,
    Anki SRS & Diagnostic Exam Engine.
    Covers Authentication, User Profiles, Onboarding, Languages, Curriculum, Exercises,
    Vocabularies, Spaced Repetition (SRS), Mock Exams, Gamification, and Leaderboards.
  version: 3.0.0
  contact:
    name: Merantalk Engineering Team
    url: https://github.com/agamlatiff/codeabroad

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development API Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Human-readable error explanation
        code:
          type: string
          example: SPECIFIC_ERROR_CODE

  responses:
    BadRequestError:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Missing, invalid, or expired authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Access to the requested resource is forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Resource conflict (e.g., duplicate email or username)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequestsError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

paths:
  # ==========================================
  # SYSTEM HEALTH
  # ==========================================
  /health:
    get:
      tags: [System Health]
      summary: Check system connectivity and health status
      responses:
        "200":
          description: System is operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "503":
          description: One or more backing dependencies (PostgreSQL or Redis) are degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: "^[a-zA-Z0-9_-]+$"
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
                remember_me:
                  type: boolean
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/google:
    post:
      tags: [Authentication]
      summary: Exchange Google OAuth 2.0 authorization code and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                remember_me:
                  type: boolean
      responses:
        "200":
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: Conflict — Google account already linked to another user or matching local email is unverified (`LOCAL_ACCOUNT_UNVERIFIED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/logout:
    post:
      tags: [Authentication]
      security:
        - BearerAuth: []
        - {}
      summary: Revoke current session token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/logout-all:
    post:
      tags: [Authentication]
      security: [{ BearerAuth: [] }]
      summary: Revoke all active sessions for the current user
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # USERS
  # ==========================================
  /users/me:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get authenticated user profile
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Update authenticated user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                bio:
                  type: string
                  maxLength: 500
                avatar_url:
                  type: string
                  maxLength: 500
                daily_goal_minutes:
                  type: integer
                  enum: [5, 15, 30, 45]
                has_seen_roadmap_tour:
                  type: boolean
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /users/me/activity-logs:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get 7-day learning activity logs and streak status
      responses:
        "200":
          description: Activity logs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/me/daily-rewards:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get daily rewards status
      responses:
        "200":
          description: Daily rewards status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/me/daily-rewards/claim:
    post:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Claim daily reward (vocab_quest or golden_chest; golden_chest awards +50 XP and +20 Gems after 50+ daily XP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reward_type]
              properties:
                reward_type:
                  type: string
                  enum: [vocab_quest, golden_chest]
      responses:
        "200":
          description: Daily reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # ONBOARDING
  # ==========================================
  /onboarding/languages:
    get:
      tags: [Onboarding]
      summary: List available target languages for onboarding
      responses:
        "200":
          description: Onboarding languages retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /onboarding/placement-questions/{language_id}:
    get:
      tags: [Onboarding]
      summary: Get placement test questions for a target language
      parameters:
        - name: language_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Placement questions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /onboarding:
    post:
      tags: [Onboarding]
      security: [{ BearerAuth: [] }]
      summary: Complete user onboarding and initial language enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language_id, daily_goal_minutes, initial_placement_type]
              properties:
                language_id:
                  type: string
                  format: uuid
                daily_goal_minutes:
                  type: integer
                  enum: [5, 15, 30, 45]
                initial_placement_type:
                  type: string
                  enum: [zero_beginner, placement_test, manual_select]
                manual_level_id:
                  type: string
                  format: uuid
                placement_answers:
                  type: array
                  items:
                    type: object
                    required: [exercise_id, user_answer]
                    properties:
                      exercise_id:
                        type: string
                        format: uuid
                      user_answer:
                        type: string
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # LANGUAGES
  # ==========================================
  /languages:
    get:
      tags: [Languages]
      summary: List all supported languages
      responses:
        "200":
          description: Languages retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /languages/{id}:
    get:
      tags: [Languages]
      summary: Get language details and proficiency levels
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Language details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /languages/enrollments:
    get:
      tags: [Languages]
      security: [{ BearerAuth: [] }]
      summary: Get current user's language enrollments
      responses:
        "200":
          description: Enrollments retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /languages/enroll:
    post:
      tags: [Languages]
      security: [{ BearerAuth: [] }]
      summary: Enroll authenticated user into an active destination language track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language_id]
              properties:
                language_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Enrolled in language track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /languages/switch:
    post:
      tags: [Languages]
      security: [{ BearerAuth: [] }]
      summary: Switch active learning language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language_id]
              properties:
                language_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Active language switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # CURRICULUM
  # ==========================================
  /curriculum:
    get:
      tags: [Curriculum]
      security:
        - BearerAuth: []
        - {}
      summary: Get curriculum units and lessons for active or specified language enrollment
      parameters:
        - name: language_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Curriculum retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /curriculum/lessons/{id}:
    get:
      tags: [Curriculum]
      security:
        - BearerAuth: []
        - {}
      summary: Get lesson details
      parameters:
        - name: id
          in: path
          required: true
          description: Lesson UUID or ASCII URL slug
          schema:
            type: string
      responses:
        "200":
          description: Lesson details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Previous lesson nodes must be completed first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson node not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /curriculum/lessons/{id}/complete:
    post:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Mark lesson as completed and award XP
      parameters:
        - name: id
          in: path
          required: true
          description: Lesson UUID or ASCII URL slug
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: Lesson completed (includes progress, gamification, unlocked_next_lesson_id, awarded_badges)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Lesson locked or incomplete exercise attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson node not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /curriculum/grammar-points:
    get:
      tags: [Curriculum]
      security:
        - BearerAuth: []
        - {}
      summary: Get open active-language grammar reference by level UUID or language/level filter
      parameters:
        - name: level_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Active target language ISO code (e.g. ja)
          schema:
            type: string
        - name: level_code
          in: query
          required: false
          description: Proficiency level code filter (e.g. N5, N4, ALL)
          schema:
            type: string
      responses:
        "200":
          description: Grammar points retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /curriculum/grammar-points/{id}/check:
    post:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Submit grammar point mini-quiz score and schedule SRS review
      parameters:
        - name: id
          in: path
          required: true
          description: Grammar point UUID or canonical code (e.g. GP-JA-N5-001)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correct_count, total_questions]
              properties:
                correct_count:
                  type: integer
                  minimum: 0
                total_questions:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        "200":
          description: Grammar check recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /curriculum/kana:
    get:
      tags: [Curriculum]
      security:
        - BearerAuth: []
        - {}
      summary: Get Kana & Kanji reference chart with user mastery progress
      parameters:
        - name: script
          in: query
          required: false
          schema:
            type: string
            enum: [hiragana, katakana, kanji, all]
      responses:
        "200":
          description: Kana chart retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /curriculum/kana/practice:
    post:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Record interactive Kana/Kanji drill results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [character, is_correct]
                    properties:
                      character:
                        type: string
                      is_correct:
                        type: boolean
      responses:
        "200":
          description: Kana practice recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # EXERCISES
  # ==========================================
  /exercises/lesson/{lesson_id}:
    get:
      tags: [Exercises]
      security:
        - BearerAuth: []
        - {}
      summary: Get exercises for a specific lesson
      parameters:
        - name: lesson_id
          in: path
          required: true
          description: Lesson UUID or ASCII URL slug
          schema:
            type: string
      responses:
        "200":
          description: Exercises retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /exercises/submit:
    post:
      tags: [Exercises]
      security:
        - BearerAuth: []
        - {}
      summary: Submit exercise answer for evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exercise_id, user_answer]
              properties:
                exercise_id:
                  type: string
                  format: uuid
                user_answer:
                  type: string
                  minLength: 1
                  maxLength: 2000
                time_spent_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
                skip_srs_schedule:
                  type: boolean
      responses:
        "200":
          description: Answer evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # VOCABULARIES
  # ==========================================
  /vocabularies/daily:
    get:
      tags: [Vocabularies]
      security: [{ BearerAuth: [] }]
      summary: Get daily vocabulary set
      parameters:
        - name: limit
          in: query
          required: false
          description: Items per request (values above 50 are clamped down to 50)
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Daily vocabularies retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

