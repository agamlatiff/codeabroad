  # ==========================================
  # FLASHCARDS
  # ==========================================
  /flashcards/decks:
    get:
      tags: [Flashcards]
      security:
        - BearerAuth: []
        - {}
      summary: List flashcard decks (or cursor-paginated deck slices with review progress counters and dynamic level counts)
      parameters:
        - name: lang
          in: query
          required: false
          description: "Target language ISO code (`ja` default for Japanese JLPT, or `en-us` for American English CEFR / TOEFL iBT)"
          schema:
            type: string
        - name: level
          in: query
          required: false
          description: "Proficiency level code filter (`N5`..`N1` for `ja`, `A1`..`C2` for `en-us`, or `ALL` / `SEMUA`)"
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: "Optional topic or script category filter (`all` / `semua` for all). For `ja`: script decks (`hiragana`, `katakana`, `kanji`), virtual `vocab` (excludes pure script decks), and topical categories (`greetings`, `numbers`, `food`, `verbs`, `places`, `adjectives`, `objects`, `family`, `directions`, `shopping`, `weather`, `work_study`, `travel`, `health`, `culture`, and N4–N1 domain categories such as `verbs_n4`, `adjectives_n4`, `city_n3`, `work_n3`, `business_n2`, `academic_n2`, `policy_n1`, `science_n1`). For `en-us`: `daily`, `work_study`, `phrasal_idioms`, `academic_toefl`."
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search matching deck title, description, or proficiency level code
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Opaque URL-safe base64 keyset pagination cursor (`next_cursor` from previous response)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Decks per page (positive integer; values above 30 are clamped down to 30)
          schema:
            type: integer
            minimum: 1
            default: 12
        - name: paginated
          in: query
          required: false
          description: "Set to `1` or `true` to force the paginated response envelope (also activated automatically when `cursor`, `limit`, `category`, or `q` is supplied)"
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          description: "Flashcard decks retrieved. Paginated responses return `{ items, next_cursor, has_more, total_count, level_counts }` where `level_counts` is dynamically keyed by uppercase level codes (`N5..N1` for `ja` or `A1..C2` for `en-us`, plus `ALL`). Unpaginated responses return an array of decks with review progress counters and `sample_cards`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

