          $ref: "#/components/responses/TooManyRequestsError"

  /gamification/coaching:
    post:
      tags: [Gamification]
      security: [{ BearerAuth: [] }]
      summary: "Submit mentorship coaching request (`cv-review` requires `target_role` & `resume_url`; `mock-interview` requires `discord_handle` & `focus_topic`)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [cv-review, mock-interview]
                target_role:
                  type: string
                  maxLength: 120
                github_url:
                  type: string
                  maxLength: 500
                resume_url:
                  type: string
                  maxLength: 500
                discord_handle:
                  type: string
                  maxLength: 100
                interview_language:
                  type: string
                  maxLength: 50
                focus_topic:
                  type: string
                  maxLength: 120
                preferred_time:
                  type: string
                  maxLength: 120
                notes:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Coaching submitted (`submission`, updated `status`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: "Invalid coaching fields (`INVALID_COACHING_PAYLOAD`) or missing coaching coupon (`INSUFFICIENT_COUPONS`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # LEADERBOARD
  # ==========================================
  /leaderboard/weekly:
    get:
      tags: [Leaderboard]
      security:
        - BearerAuth: []
        - {}
      summary: Get weekly leaderboard rankings
      parameters:
        - name: division
          in: query
          required: false
          description: Canonical league division (`bronze`, `silver`, `gold`, `diamond`). Legacy station aliases (`shinjuku`, `shibuya`, `akihabara`, `roppongi`) are also accepted during transition. When omitted for authenticated users, auto-selects the user's division.
          schema:
            type: string
            enum: [bronze, silver, gold, diamond, shinjuku, shibuya, akihabara, roppongi]
      responses:
        "200":
          description: Weekly leaderboard retrieved (includes last_week_reward when an authenticated user placed Top 3 last ISO week)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /leaderboard/weekly/claim:
    post:
      tags: [Leaderboard]
      summary: "Claim previous ISO week Top-3 league podium Gems prize (1st: 100, 2nd: 50, 3rd: 25 Gems)"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Weekly Top-3 reward claimed and Gems credited (`reward`, `new_gems`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: "No unclaimed Top-3 reward for previous ISO week (`NO_PENDING_WEEKLY_REWARD`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Previous week podium reward already claimed (`WEEKLY_REWARD_ALREADY_CLAIMED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
