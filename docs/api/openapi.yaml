openapi: 3.0.3
info:
  title: CodeAbroad API Documentation
  description: >
    Official RESTful API documentation for CodeAbroad — Global Language Mastery Platform,
    Anki SRS & Diagnostic Exam Engine.
    Covers Authentication, User Profiles, Onboarding, Languages, Curriculum, Exercises,
    Vocabularies, Spaced Repetition (SRS), Mock Exams, Gamification, and Leaderboards.
  version: 3.0.0
  contact:
    name: CodeAbroad Engineering Team
    url: https://github.com/agamlatiff/codeabroad

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development API Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Human-readable error explanation
        code:
          type: string
          example: SPECIFIC_ERROR_CODE

  responses:
    BadRequestError:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Missing, invalid, or expired authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Resource conflict (e.g., duplicate email or username)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

paths:
  # ==========================================
  # SYSTEM HEALTH
  # ==========================================
  /health:
    get:
      tags: [System Health]
      summary: Check system connectivity and health status
      responses:
        "200":
          description: System is operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ BearerAuth: [] }]
      summary: Revoke current session token
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout-all:
    post:
      tags: [Authentication]
      security: [{ BearerAuth: [] }]
      summary: Revoke all active sessions for the current user
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # USERS
  # ==========================================
  /users/me:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get authenticated user profile
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Update authenticated user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/me/activity-logs:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get 7-day learning activity logs and streak status
      responses:
        "200":
          description: Activity logs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/me/daily-rewards:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get daily rewards status
      responses:
        "200":
          description: Daily rewards status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/me/daily-rewards/claim:
    post:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Claim daily reward
      responses:
        "200":
          description: Daily reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # ONBOARDING
  # ==========================================
  /onboarding/languages:
    get:
      tags: [Onboarding]
      summary: List available target languages for onboarding
      responses:
        "200":
          description: Onboarding languages retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /onboarding/placement-questions/{language_id}:
    get:
      tags: [Onboarding]
      summary: Get placement test questions for a target language
      parameters:
        - name: language_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Placement questions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /onboarding:
    post:
      tags: [Onboarding]
      security: [{ BearerAuth: [] }]
      summary: Complete user onboarding and initial language enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # LANGUAGES
  # ==========================================
  /languages:
    get:
      tags: [Languages]
      summary: List all supported languages
      responses:
        "200":
          description: Languages retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /languages/{id}:
    get:
      tags: [Languages]
      summary: Get language details and proficiency levels
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Language details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /languages/enrollments:
    get:
      tags: [Languages]
      security: [{ BearerAuth: [] }]
      summary: Get current user's language enrollments
      responses:
        "200":
          description: Enrollments retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /languages/switch:
    post:
      tags: [Languages]
      security: [{ BearerAuth: [] }]
      summary: Switch active learning language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language_id]
              properties:
                language_id:
                  type: string
      responses:
        "200":
          description: Active language switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # CURRICULUM
  # ==========================================
  /curriculum:
    get:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Get curriculum units and lessons for active enrollment
      responses:
        "200":
          description: Curriculum retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /curriculum/lessons/{id}:
    get:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Get lesson details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /curriculum/lessons/{id}/complete:
    post:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Mark lesson as completed and award XP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /curriculum/grammar-points:
    get:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Get grammar points reference
      responses:
        "200":
          description: Grammar points retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # EXERCISES
  # ==========================================
  /exercises/lesson/{lesson_id}:
    get:
      tags: [Exercises]
      security: [{ BearerAuth: [] }]
      summary: Get exercises for a specific lesson
      parameters:
        - name: lesson_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exercises retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /exercises/submit:
    post:
      tags: [Exercises]
      security: [{ BearerAuth: [] }]
      summary: Submit exercise answer for evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Answer evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # VOCABULARIES
  # ==========================================
  /vocabularies/daily:
    get:
      tags: [Vocabularies]
      security: [{ BearerAuth: [] }]
      summary: Get daily vocabulary set
      responses:
        "200":
          description: Daily vocabularies retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # SPACED REPETITION (SRS)
  # ==========================================
  /srs/due:
    get:
      tags: [SRS]
      security: [{ BearerAuth: [] }]
      summary: Get due SRS review cards
      responses:
        "200":
          description: Due SRS cards retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /srs/review:
    post:
      tags: [SRS]
      security: [{ BearerAuth: [] }]
      summary: Submit SRS review rating (SM-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: SRS review processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # EXAMS
  # ==========================================
  /exams/questions/{level_id}:
    get:
      tags: [Exams]
      security: [{ BearerAuth: [] }]
      summary: Get diagnostic mock exam questions for a proficiency level
      parameters:
        - name: level_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exam questions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /exams/result/{level_id}:
    get:
      tags: [Exams]
      security: [{ BearerAuth: [] }]
      summary: Get mock exam result for a proficiency level
      parameters:
        - name: level_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exam result retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /exams/submit:
    post:
      tags: [Exams]
      security: [{ BearerAuth: [] }]
      summary: Submit mock exam answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Exam submitted and graded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # GAMIFICATION
  # ==========================================
  /gamification/status:
    get:
      tags: [Gamification]
      security: [{ BearerAuth: [] }]
      summary: Get user gamification status (XP, level, streak, gems)
      responses:
        "200":
          description: Gamification status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /gamification/shop:
    get:
      tags: [Gamification]
      security: [{ BearerAuth: [] }]
      summary: List available shop items
      responses:
        "200":
          description: Shop items retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /gamification/shop/buy:
    post:
      tags: [Gamification]
      security: [{ BearerAuth: [] }]
      summary: Purchase a shop item using gems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Item purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /gamification/badges:
    get:
      tags: [Gamification]
      security: [{ BearerAuth: [] }]
      summary: List user badges
      responses:
        "200":
          description: Badges retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /gamification/chests/claim:
    post:
      tags: [Gamification]
      security: [{ BearerAuth: [] }]
      summary: Claim daily golden chest
      responses:
        "200":
          description: Daily chest claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /gamification/coaching:
    post:
      tags: [Gamification]
      security: [{ BearerAuth: [] }]
      summary: Submit coaching check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Coaching submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==========================================
  # LEADERBOARD
  # ==========================================
  /leaderboard/weekly:
    get:
      tags: [Leaderboard]
      summary: Get weekly leaderboard rankings
      responses:
        "200":
          description: Weekly leaderboard retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
