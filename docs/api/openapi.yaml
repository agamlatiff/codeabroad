openapi: 3.0.3
info:
  title: Merantalk API Documentation
  description: >
    Official RESTful API documentation for Merantalk — Global Language Mastery Platform,
    Adaptive Smart Review & Diagnostic Exam Engine.
    Supports active tracks for Japanese (JLPT N5–N1, `ja`) and American English
    (CEFR A1–C2 / TOEFL iBT, `en-us`), with Guest Trial, Free, and Merantalk Pro tiering,
    Interactive Grammar Guides, Kana & Kanji Mastery Board, Adaptive Scheduled Review for
    Exercises & Vocabulary Flashcards, Readiness Mock Exams, Daily Quests, 3-Tier Chests,
    Monthly Challenge Badges, Arcade Shop & 2x XP Boosters, and Weekly Leagues (anchored to WIB / Asia/Jakarta UTC+7).
    All JSON request bodies are capped at 1 MB (`413 PAYLOAD_TOO_LARGE`) and protected mutations
    enforce Redis-backed distributed rate limiting (`429 TOO_MANY_REQUESTS` with
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `Retry-After` headers).
  version: 3.2.0
  contact:
    name: Merantalk Engineering Team
    url: https://github.com/agamlatiff/merantalk

servers:
  - url: https://merantalk-d21r.vercel.app/api/v1
    description: Production API Server (Vercel Serverless Singapore sin1)
  - url: http://localhost:8080/api/v1
    description: Local Development API Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Human-readable error explanation
        code:
          type: string
          example: SPECIFIC_ERROR_CODE
        details:
          type: object
          additionalProperties: true
          nullable: true

  responses:
    BadRequestError:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Missing, invalid, or expired authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Access to the requested resource is forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Resource conflict (e.g., duplicate email or username)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequestsError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

paths:
  # ==========================================
  # SYSTEM HEALTH
  # ==========================================
  /health:
    get:
      tags: [System Health]
      summary: Check system connectivity and health status
      responses:
        "200":
          description: System is operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "503":
          description: One or more backing dependencies (PostgreSQL or Redis) are degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: "^[a-zA-Z0-9_-]+$"
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
                remember_me:
                  type: boolean
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/google:
    post:
      tags: [Authentication]
      summary: Exchange Google OAuth 2.0 authorization code and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 2048
                redirect_uri:
                  type: string
                  description: "Optional OAuth 2.0 redirect URI (defaults to \"postmessage\"; custom URIs must match an allowed origin's /login or /register path)"
                remember_me:
                  type: boolean
      responses:
        "200":
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: "Invalid payload or Google OAuth not configured on server (`GOOGLE_OAUTH_NOT_CONFIGURED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Google token verification failed (`GOOGLE_AUTH_FAILED`) or Google email unverified (`GOOGLE_EMAIL_NOT_VERIFIED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict — Google account already linked to another user (`OAUTH_ACCOUNT_CONFLICT`), matching local email is unverified (`LOCAL_ACCOUNT_UNVERIFIED`), or username collision (`USERNAME_TAKEN`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/logout:
    post:
      tags: [Authentication]
      security:
        - BearerAuth: []
        - {}
      summary: Revoke current session token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/logout-all:
    post:
      tags: [Authentication]
      security: [{ BearerAuth: [] }]
      summary: Revoke all active sessions for the current user
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # USERS
  # ==========================================
  /users/me:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get authenticated user profile, subscription tier, and gamification stats
      responses:
        "200":
          description: "User profile retrieved (3-pillar aggregate including subscription_tier, subscription_expires_at, xp_booster_expires_at, profile, and gamification stats)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Update authenticated user profile (at least one field required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                bio:
                  type: string
                  maxLength: 500
                avatar_url:
                  type: string
                  maxLength: 500
                  description: Valid https:// URL or relative path starting with /
                daily_goal_minutes:
                  type: integer
                  enum: [5, 15, 30, 45]
                has_seen_roadmap_tour:
                  type: boolean
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /users/me/activity-logs:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get 7-day WIB learning activity logs, 90-day active dates, and streak status
      responses:
        "200":
          description: Activity logs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /users/me/daily-rewards:
    get:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: Get daily rewards status
      responses:
        "200":
          description: Daily rewards status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/me/daily-rewards/claim:
    post:
      tags: [Users]
      security: [{ BearerAuth: [] }]
      summary: "Claim daily reward (vocab_quest awards +30 XP after 3+ flashcards reviewed today WIB; golden_chest awards +50 XP and +20 Gems after 50+ non-chest daily XP WIB)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reward_type]
              properties:
                reward_type:
                  type: string
                  enum: [vocab_quest, golden_chest]
      responses:
        "200":
          description: Daily reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # ONBOARDING
  # ==========================================
  /onboarding/languages:
    get:
      tags: [Onboarding]
      summary: "List active target destination languages for onboarding (e.g. ja, en-us)"
      responses:
        "200":
          description: Onboarding languages retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /onboarding/placement-questions/{language_id}:
    get:
      tags: [Onboarding]
      summary: Get placement test questions for a target language
      parameters:
        - name: language_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Placement questions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /onboarding:
    post:
      tags: [Onboarding]
      security: [{ BearerAuth: [] }]
      summary: Complete user onboarding and initial language enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language_id, daily_goal_minutes, initial_placement_type]
              properties:
                language_id:
                  type: string
                  format: uuid
                daily_goal_minutes:
                  type: integer
                  enum: [5, 15, 30, 45]
                initial_placement_type:
                  type: string
                  enum: [zero_beginner, placement_test, manual_select]
                manual_level_id:
                  type: string
                  format: uuid
                placement_answers:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [exercise_id, user_answer]
                    properties:
                      exercise_id:
                        type: string
                        format: uuid
                      user_answer:
                        type: string
                        minLength: 1
                        maxLength: 2000
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # LANGUAGES
  # ==========================================
  /languages:
    get:
      tags: [Languages]
      summary: "List all supported languages (active tracks: Japanese ja & American English en-us, plus upcoming tracks)"
      responses:
        "200":
          description: Languages retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /languages/{id}:
    get:
      tags: [Languages]
      summary: "Get language details and proficiency levels (e.g. JLPT N5–N1 for ja, CEFR A1–C2 for en-us)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Language details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /languages/enrollments:
    get:
      tags: [Languages]
      security: [{ BearerAuth: [] }]
      summary: Get current user's language enrollments
      responses:
        "200":
          description: Enrollments retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /languages/enroll:
    post:
      tags: [Languages]
      security: [{ BearerAuth: [] }]
      summary: "Enroll authenticated user into an active destination language track (awards multilingual_explorer badge on 2+ tracks)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language_id]
              properties:
                language_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Enrolled in language track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /languages/switch:
    post:
      tags: [Languages]
      security: [{ BearerAuth: [] }]
      summary: Switch active learning language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language_id]
              properties:
                language_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Active language switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  # ==========================================
  # CURRICULUM
  # ==========================================
  /curriculum:
    get:
      tags: [Curriculum]
      security:
        - BearerAuth: []
        - {}
      summary: Get curriculum units and lessons for active or specified language enrollment and optional proficiency level
      parameters:
        - name: language_id
          in: query
          required: false
          description: "Optional language UUID override (defaults to authenticated user's active enrollment, or Japanese `ja` for unauthenticated guests)"
          schema:
            type: string
            format: uuid
        - name: level_code
          in: query
          required: false
          description: "Optional proficiency level code override (`N5`..`N1` for `ja`, `A1`..`C2` for `en-us`). Beginner levels (`N5`, `A1`) are open to guests; intermediate levels (`N4–N3`, `A2–B1`) require login (`401 LOGIN_REQUIRED_FOR_LEVEL`); advanced levels (`N2–N1`, `B2–C2`) require Merantalk Pro (`403 PRO_REQUIRED_FOR_LEVEL`)."
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: "Curriculum retrieved (includes `language`, active `level`, `available_levels` for level switcher UI, `total_lessons`, `completed_lessons`, `progress_percent`, `current_lesson_id`, and `units` with Guest/Free/Pro unlock states)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: "Missing/invalid token or unauthenticated guest requesting a non-beginner level (`LOGIN_REQUIRED_FOR_LEVEL` on `N4–N1` / `A2–C2`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tier access denied — Free account requesting a Pro-tier level (`PRO_REQUIRED_FOR_LEVEL` on `N2–N1` / `B2–C2`, with `details.required_tier` and `details.level_code`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /curriculum/lessons/{id}:
    get:
      tags: [Curriculum]
      security:
        - BearerAuth: []
        - {}
      summary: Get lesson details, curated study preview cards, grammar points, and sanitized exercises
      parameters:
        - name: id
          in: path
          required: true
          description: Lesson UUID or ASCII URL slug (max 160 characters)
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: "Lesson details retrieved (includes `study_items` — server-curated distractor-free preview cards preserving word spaces for English `sentence_builder` — `grammar_points`, and sanitized `exercises` with spoiler-free contextual hints and furigana)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: "Missing/invalid token or unauthenticated guest requesting a lesson in a non-beginner level (`LOGIN_REQUIRED_FOR_LEVEL` on `N4–N1` / `A2–C2`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Access forbidden — covers both locked sequential lessons (`LESSON_LOCKED`, including unauthenticated guests on Unit 2+ of beginner levels and non-Pro users with incomplete prerequisites) and Pro tier locks (`PRO_REQUIRED_FOR_LEVEL` for free users on `N2–N1` / `B2–C2`). Guest attempts on non-beginner levels return `401 LOGIN_REQUIRED_FOR_LEVEL`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson node not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /curriculum/lessons/{id}/complete:
    post:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Mark lesson as completed, verify attempt accuracy server-side, and award XP
      parameters:
        - name: id
          in: path
          required: true
          description: Lesson UUID or ASCII URL slug (max 160 characters)
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: "Lesson completed (includes `progress`, server-verified `session_score`, `xp_earned`, `gamification`, `unlocked_next_lesson_id`, `unlocked_next_lesson_slug`, `awarded_badges`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: "Invalid identifier/payload, unconfigured exercises (`LESSON_EXERCISES_REQUIRED`), incomplete exercise attempts (`EXERCISES_NOT_ATTEMPTED`), or score below 60% on initial completion (`LESSON_SCORE_TOO_LOW`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: "Lesson locked (`LESSON_LOCKED` — prerequisite lessons incomplete or user not enrolled in active track)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson node not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /curriculum/grammar-points:
    get:
      tags: [Curriculum]
      security:
        - BearerAuth: []
        - {}
      summary: Get open active-language grammar reference by level UUID or language/level filter
      parameters:
        - name: level_id
          in: query
          required: false
          description: Proficiency level UUID (either `level_id` or `lang`/`level_code` must be provided)
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: "Active target language ISO code (`ja` | `en-us`; defaults to `ja` when `level_code` is provided without `lang`)"
          schema:
            type: string
        - name: level_code
          in: query
          required: false
          description: "Proficiency level code filter (`N5`..`N1` for `ja`, `A1`..`C2` for `en-us`, or `ALL` / `SEMUA`)"
          schema:
            type: string
      responses:
        "200":
          description: "Grammar points retrieved (open reference across all active-language levels with no tier lock; authenticated users also receive personalized mastery fields `is_understood`, `quiz_score`, `attempts_count`, and `next_review_at`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /curriculum/grammar-points/{id}/check:
    post:
      tags: [Curriculum]
      security: [{ BearerAuth: [] }]
      summary: Submit grammar point mini-quiz score and schedule adaptive follow-up review
      parameters:
        - name: id
          in: path
          required: true
