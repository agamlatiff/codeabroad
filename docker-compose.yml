services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: codeabroad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-codeabroad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codeabroad_secret}
      POSTGRES_DB: ${DB_NAME:-codeabroad}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-codeabroad} -d ${DB_NAME:-codeabroad}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 2. Redis Session & Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: codeabroad-redis
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-codeabroad_redis_secret}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 3. Backend Golang API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeabroad-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - ENV=${ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-codeabroad}
      - DB_PASSWORD=${DB_PASSWORD:-codeabroad_secret}
      - DB_NAME=${DB_NAME:-codeabroad}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-codeabroad_redis_secret}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-must-be-at-least-32-chars-long}
      - JWT_EXPIRATION_MINUTES=15
      - JWT_REFRESH_EXPIRATION_DAYS=30
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 4. Frontend React Vite SPA
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeabroad-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 5. Gateway Reverse Proxy (Nginx)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: codeabroad-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - codeabroad-network

# -----------------------------------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

networks:
  codeabroad-network:
    driver: bridge
