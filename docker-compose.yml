services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: codeabroad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-codeabroad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codeabroad_secret}
      POSTGRES_DB: ${DB_NAME:-codeabroad}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-codeabroad} -d ${DB_NAME:-codeabroad}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 2. Redis Session & Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: codeabroad-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 3. Apache Kafka (KRaft Mode)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: codeabroad-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: '4L622nShTUiAnsYh0-x4wA'
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 4. Backend Golang API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeabroad-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-codeabroad}
      - DB_PASSWORD=${DB_PASSWORD:-codeabroad_secret}
      - DB_NAME=${DB_NAME:-codeabroad}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-must-be-at-least-32-chars-long}
      - JWT_EXPIRATION_MINUTES=15
      - JWT_REFRESH_EXPIRATION_DAYS=30
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 5. Frontend React Vite SPA
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeabroad-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - codeabroad-network

  # ---------------------------------------------------------------------------
  # 6. Gateway Reverse Proxy (Nginx)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: codeabroad-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - codeabroad-network

# -----------------------------------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

networks:
  codeabroad-network:
    driver: bridge
